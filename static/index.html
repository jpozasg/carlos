<!doctype html>
<html lang="en" data-theme="cluster">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Carlos</title>
<link rel="icon" href="/static/brand/favicon.svg?v=3" type="image/svg+xml">

<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<script>try{var md=JSON.parse(localStorage.getItem('carlos.mode')||'"auto"');if(md!=='auto')document.documentElement.dataset.mode=md;if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('os-dark')}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main" data-i18n-skip></a>
<header class="top"><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="main" tabindex="-1"><div class="skel"></div></main>
<footer class="wrap" id="footer"></footer>
<div id="tip" role="presentation"></div>
<dialog id="lightbox"><div class="lb"><img alt=""><button class="navbtn prev" type="button" data-aria="photo_prev">‹</button><button class="navbtn next" type="button" data-aria="photo_next">›</button><button class="close" type="button" data-aria="close_dialog">×</button><span class="count"></span></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
